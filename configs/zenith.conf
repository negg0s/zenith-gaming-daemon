# ==============================================================================
# Zenith Gaming Daemon Configuration (/etc/zenith/zenith.conf)
# ==============================================================================

# Dynamic cgroup v2 core isolation (moves Discord, Chrome to housekeeping cores)
cgroup_isolation_enabled = true

# Prioritize AMD 3D V-Cache CCD cores for gaming threads
vcache_pinning_enabled = true

# Prioritize Intel Performance (P) cores over E-cores
hybrid_pinning_enabled = true

# Apply low-latency sysctl tuning
sysctl_tuning_enabled = true

# Disable split lock mitigation to prevent Wine/DirectX stutter
split_lock_mitigation_disabled = true

# Force Transparent HugePages (THP) for faster memory allocation in DXVK
thp_always_enabled = true

# Lock GPU performance levels (prevents memory clock downclocking)
gpu_clock_lock_enabled = true

# Elevate gaming threads to real-time priority (SCHED_RR / nice -20)
realtime_process_priority = true

# PipeWire real-time audio quantum (sub-ms audio latency)
pipewire_quantum_tuning = true
pipewire_latency_numerator = 64
pipewire_latency_denominator = 48000

# Virtual memory latency tuning
swappiness = 10
dirty_ratio = 5
compaction_proactiveness = 0

# Daemon polling frequency (milliseconds)
poll_interval_ms = 500
