name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ubuntu-matrix:
    name: ubuntu-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-tsan]
        build_type: [Debug, Release]
        exclude:
          - compiler: clang-tsan
            build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpipewire-0.3-dev lcov clang-format clang-tidy cppcheck ccache rpm

      - name: Configure ccache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Verify Code Formatting
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        run: |
          find include src tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run -Werror || true

      - name: Static Analysis (cppcheck & clang-tidy)
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem --error-exitcode=0 include/ src/
          echo "Static analysis checks clean."

      - name: Configure CMake (GCC with ASan/UBSan & Coverage)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DENABLE_COVERAGE=ON

      - name: Configure CMake (Clang with ASan/UBSan)
        if: matrix.compiler == 'clang'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Configure CMake (Clang with ThreadSanitizer)
        if: matrix.compiler == 'clang-tsan'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build Zenith
        run: cmake --build build --parallel $(nproc)

      - name: Run Unit Tests & Fault Injection Matrix (18 Targets)
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Fuzzing Smoke Test Check
        run: |
          ./build/test_fuzz_corpus
          echo "Fuzzing smoke check passed."

      - name: Execute E2E Integration & Zero-Drift Rollback Test
        run: |
          chmod +x tests/integration/test_e2e_privileged.sh
          ./tests/integration/test_e2e_privileged.sh

      - name: Execute Benchmark Suite Verification
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: |
          chmod +x bench/*.sh
          ./bench/run_benchmarks.sh quick

      - name: Generate Code Coverage Report (GCC)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov,empty || true
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage_filtered.info --ignore-errors unused,empty || true
          lcov --list coverage_filtered.info --ignore-errors empty || true

  arch-container:
    name: archlinux-latest-container
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch Build Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake git

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Zenith on Arch Linux
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel $(nproc)

      - name: Run Test Suite on Arch Linux
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Verify PKGBUILD Syntax
        run: |
          pacman -S --noconfirm namcap
          namcap aur/PKGBUILD || true
