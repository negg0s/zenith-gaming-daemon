name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libpipewire-0.3-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6bb034414c767aa5ec307795e8e6601d01424e27 # v3.28.11
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Build Zenith
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6bb034414c767aa5ec307795e8e6601d01424e27 # v3.28.11
      with:
        category: "/language:${{matrix.language}}"
